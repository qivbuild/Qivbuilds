<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><title>Admin</title>
<style>:root{--bg:#fff;--tx:#1f1f1f;--mut:#5f6368;--bl:#0b57d0;--ib:#e8eefc;--ln:#dadce0}@media(prefers-color-scheme:dark){:root{--bg:#000;--tx:#e3e3e3;--mut:#9aa0a6;--bl:#8ab4f8;--ib:#1c2a4a;--ln:#2a2a2a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Roboto,Arial,sans-serif;padding-bottom:4rem}
.tabs{display:flex;gap:.5rem;overflow-x:auto;padding:.75rem 1rem;position:sticky;top:0;background:var(--bg);box-shadow:0 1px 0 var(--ln);z-index:5}.tabs button,.b{flex:none;padding:.55rem 1rem;border-radius:1.2rem;border:0;background:var(--ib);color:var(--bl);font-weight:500;font-size:.9rem;cursor:pointer}.tabs .on,.b.f{background:var(--bl);color:var(--bg)}.b.r{background:#fce8e6;color:#c5221f}
main{padding:1rem;max-width:44rem;margin:0 auto}input,select,textarea{width:100%;padding:.6rem;margin:.25rem 0;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}label{font-size:.8rem;color:var(--mut);display:block;margin-top:.5rem}
.card{border:1px solid var(--ln);border-radius:12px;padding:.8rem;margin:.6rem 0}details{border:1px solid var(--ln);border-radius:10px;margin:.4rem 0 .4rem .6rem}summary{cursor:pointer;padding:.6rem .8rem;font-weight:600;display:flex;gap:.5rem;align-items:center;justify-content:space-between}.row{display:flex;gap:.4rem;flex-wrap:wrap;align-items:center}.row>input{flex:1;min-width:8rem}
#ed,.ed{min-height:14rem;border:1px solid var(--ln);border-radius:8px;padding:.7rem;line-height:1.6}.ed img{max-width:100%}.thumbs{display:flex;gap:.4rem;flex-wrap:wrap}.thumbs div{position:relative}.thumbs img{width:4.5rem;height:4.5rem;object-fit:cover;border-radius:8px}.thumbs i{position:absolute;top:0;right:0;background:#c5221f;color:#fff;border-radius:50%;width:1.2rem;height:1.2rem;text-align:center;font-size:.8rem;cursor:pointer;font-style:normal}
.tb{display:flex;gap:.3rem;flex-wrap:wrap;margin:.4rem 0}.msg{position:fixed;bottom:1rem;left:50%;transform:translateX(-50%);background:#188038;color:#fff;padding:.6rem 1rem;border-radius:10px;display:none;z-index:9}</style></head><body>
<div id="login" style="display:none;padding:2rem;max-width:22rem;margin:auto"><h2>Admin Login</h2><input id="pw" type="password" placeholder="Password"><button class="b f" onclick="login()">Login</button><p id="le" style="color:#c5221f"></p></div>
<div id="app" style="display:none"><div class="tabs" id="tabs"></div><main id="main"></main></div><div class="msg" id="msg"></div>
<script>
var $=function(i){return document.getElementById(i)},cats=[],posts=[],cur=null,SET={};
function toast(t,bad){var m=$('msg');m.textContent=t;m.style.background=bad?'#c5221f':'#188038';m.style.display='block';setTimeout(function(){m.style.display='none'},2500)}
function api(u,m,b){return fetch('/api/'+u,{method:m||'GET',headers:{'content-type':'application/json'},body:b?JSON.stringify(b):undefined}).then(function(r){if(r.status===401){show();throw 0}return r.json().catch(function(){toast('API se ghalat jawab: bindings check karein',1);throw 0})})}
function esc(t){return String(t||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function show(){$('app').style.display='none';$('login').style.display='block'}
function login(){fetch('/api/login',{method:'POST',body:JSON.stringify({password:$('pw').value})}).then(function(r){if(r.ok)start();else $('le').textContent=r.status==401?'Password ghalat hai':'API error: Functions/bindings check karein'}).catch(function(){$('le').textContent='API nahi mili'})}
// ---- image: compress -> webp -> R2 ----
function compress(file){return createImageBitmap(file).then(function(b){var LIM=62000,list=[];
 [[1280,1024,800],[640]].forEach(function(ws,t){(t?[.7,.5,.35]:[.75,.65,.55,.45,.35]).forEach(function(q){ws.forEach(function(w){list.push([Math.min(w,b.width),q])})})});
 function enc(w,q){var h=Math.max(1,Math.round(b.height*w/b.width)),c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(b,0,0,w,h);return new Promise(function(ok){c.toBlob(ok,'image/webp',q)})}
 function next(k,best){if(k>=list.length)return best;return enc(list[k][0],list[k][1]).then(function(bl){if(bl.size<=LIM)return bl;if(!best||bl.size<best.size)best=bl;return next(k+1,best)})}
 return next(0,null)})}
function enc(b,w,lim){var ww=Math.min(w,b.width),h=Math.max(1,Math.round(b.height*ww/b.width)),c=document.createElement('canvas');c.width=ww;c.height=h;var x=c.getContext('2d');x.imageSmoothingQuality='high';x.drawImage(b,0,0,ww,h);var qs=[.8,.7,.6,.5,.4,.3],best=null;
 function t(k){if(k>=qs.length)return Promise.resolve(best);return new Promise(function(ok){c.toBlob(ok,'image/webp',qs[k])}).then(function(bl){if(bl.size<=lim)return bl;if(!best||bl.size<best.size)best=bl;return t(k+1)})}return t(0)}
function up(file){
 if(!file||file.size>40*1024*1024){toast('Picture bohat bari hai (40MB se kam rakhein)',1);return Promise.reject(new Error('too big'))}
 return createImageBitmap(file).catch(function(){toast('Ye file picture nahi ya khul nahi saki. JPG, PNG ya WebP chunein.',1);throw new Error('not image')}).then(function(b){
  var g=Date.now().toString(36)+Math.random().toString(36).slice(2,7),V=[[480,28000],[800,45000],[1280,62000],[1600,62000]],out=[];
  function send(bl,w,n){return fetch('/api/upload?g='+g+'&w='+w,{method:'POST',headers:{'content-type':'image/webp'},body:bl}).then(function(r){if(r.status===401){show();throw new Error('login')}return r.json()}).then(function(r){if(!r||!r.url)throw new Error((r&&r.error)||'upload fail');return r.url}).catch(function(e){if(n<1&&e.message!=='login')return send(bl,w,n+1);throw e})}
  function step(k){if(k>=V.length)return Promise.resolve(out[1]);return enc(b,V[k][0],V[k][1]).then(function(bl){if(!bl)throw new Error('compress fail');return send(bl,V[k][0],0)}).then(function(u){out.push(u);return step(k+1)})}
  return step(0).then(function(u){if(b.close)b.close();return u},function(e){if(b.close)b.close();if(e.message!=='login')toast('Upload fail: '+e.message,1);throw e})})}
function pick(multi,cb){var i=document.createElement('input');i.type='file';i.accept='image/*';i.multiple=!!multi;i.onchange=function(){var fs=[].slice.call(i.files),out=[];function nx(k){if(k>=fs.length){cb(out);return}toast('Picture '+(k+1)+'/'+fs.length+' upload ho rahi hai...');var _f=fs[k];up(_f).then(function(u){out.push(u);picSharpness(_f).then(function(q){showPicReport(_f,u,q,62)}).catch(function(){toast('Picture upload ho gayi')});nx(k+1)},function(){})}if(fs.length)nx(0)};i.click()}


// ---- responsive delivery: browser ko 4 sizes do, wo khud sahi size chune ga (Improve image delivery fix) ----
function srcsetFor(u){if(!u||typeof u!=='string')return '';var sizes=[[480,'480w'],[800,'800w'],[1280,'1280w'],[1600,'1600w']],parts=[];sizes.forEach(function(sv){var nu=u.replace(/1280/g,String(sv[0])).replace(/800/g,String(sv[0]));if(sv[0]===800)nu=u;if(nu!==u||sv[0]===800)parts.push(nu+' '+sv[1])});var uniq=[];parts.forEach(function(x){if(uniq.indexOf(x)<0)uniq.push(x)});return uniq.length>1?uniq.join(', '):''}
function imgTag(u,first){var ss=srcsetFor(u);return '<img src="'+u+'"'+(ss?' srcset="'+ss+'" sizes="(max-width: 600px) 480px, (max-width: 1000px) 800px, 1280px"':'')+' alt="" loading="'+(first?'eager':'lazy')+'" decoding="async" fetchpriority="'+(first?'high':'auto')+'">'}
// ---- picture quality + Google Search Console check (sirf picture ke liye, design same) ----
function picSharpness(file){return createImageBitmap(file).then(function(b){var W=Math.min(320,b.width),H=Math.max(1,Math.round(b.height*W/b.width)),c=document.createElement('canvas');c.width=W;c.height=H;var x=c.getContext('2d',{willReadFrequently:true});x.drawImage(b,0,0,W,H);var d=x.getImageData(0,0,W,H).data,vals=[];for(var y=1;y<H-1;y++){for(var xx=1;xx<W-1;xx++){var i=(y*W+xx)*4,g=(d[i]+d[i+1]+d[i+2])/3,gl=((d[i-4]+d[i-3]+d[i-2])/3),gr=((d[i+4]+d[i+5]+d[i+6])/3),gu=((d[i-W*4]+d[i-W*4+1]+d[i-W*4+2])/3),gd=((d[i+W*4]+d[i+W*4+1]+d[i+W*4+2])/3);vals.push(Math.abs(gr-gl)+Math.abs(gd-gu))}}vals.sort(function(a,b){return a-b});var med=vals[Math.floor(vals.length/2)]||0;var _w=b.width,_h=b.height;if(b.close)b.close();return {score:Math.round(med),w:_w,h:_h}})}
function showPicReport(file,url,q,compKB){var old=$('picReport');if(old)old.remove();var box=document.createElement('div');box.id='picReport';box.style.cssText='position:fixed;left:1rem;right:1rem;bottom:1rem;z-index:99;background:var(--bg);color:var(--tx);border:1px solid var(--ln);border-radius:12px;padding:.9rem;box-shadow:0 8px 30px rgba(0,0,0,.25)';var clear=q.score>=15?['✅ Clear - Bilkul saaf hai','']:q.score>=8?['⚠️ Theek hai - thori soft hai, chaho to bari picture se dobara upload karein','']:['❌ Blurry - ye picture Google par dhundli lagegi, bari / saaf picture dobara upload karein',''];var gsc=[];gsc.push('✅ Size: 62KB se kam (Speed OK) - upload se pehle auto-compress hui');gsc.push('✅ Format: WebP');gsc.push('✅ Delivery: srcset ON - mobile par 480, desktop par 800/1280 khud chune ga (Improve image delivery fix)');gsc.push('✅ Main picture: 800 wali (45KB se kam) - pehle 1280 wali thi, isi se LCP slow tha');gsc.push(q.w>=800?'✅ Width: '+q.w+'px - clear ke liye kaafi hai':'⚠️ Width: '+q.w+'px - 800px se kam hai, bari picture behtar hogi');var html='<div style="display:flex;justify-content:space-between;gap:.5rem;align-items:center"><b>📸 Picture Quality Check</b><button class="b r" onclick="document.getElementById(\'picReport\').remove()">Band karein</button></div><div class="row" style="margin:.6rem 0"><img src="'+url+'" style="width:6rem;height:4.5rem;object-fit:cover;border-radius:8px"><div style="font-size:.85rem;line-height:1.7"><b>'+clear[0]+'</b><br>Sharpness Score: '+q.score+'/100 &nbsp;|&nbsp; Original: '+q.w+'x'+q.h+'px &nbsp;|&nbsp; Original size: '+(file.size/1024).toFixed(1)+' KB</div></div><div style="font-size:.85rem;line-height:1.8"><b>Google Search Console - Speed Check:</b><br>'+gsc.join('<br>')+'</div>';if(clear[1])html+='<div style="margin-top:.5rem;font-size:.85rem;color:#c5221f">'+clear[1]+'</div>';html+='<div style="margin-top:.6rem;display:flex;gap:.4rem;flex-wrap:wrap"><button class="b f" onclick="document.getElementById(\'picReport\').remove();toast(\'Picture theek hai - ab Post Save karein\')">✅ Theek hai, Save karein</button><button class="b" onclick="document.getElementById(\'picReport\').remove();pick(0,function(u){})">🔄 Dobara upload karein</button></div>';box.innerHTML=html;document.body.appendChild(box)}
// ---- tabs ----
var T=[['cats','Categories'],['post','New Post'],['posts','Posts'],['svc','Services'],['partners','Partners'],['fb','Facebook Page'],['opt','Optimize'],['about','About Page'],['byowner','By Owner'],['seo','SEO & Social']];
function start(){$('login').style.display='none';$('app').style.display='block';$('tabs').innerHTML=T.map(function(t){return'<button id="t_'+t[0]+'" onclick="tab(\''+t[0]+'\')">'+t[1]+'</button>'}).join('')+'<button onclick="fetch(\'/api/logout\').then(function(){show()})">Logout</button>';
 Promise.all([api('categories'),api('posts'),api('settings-all')]).then(function(r){cats=r[0];posts=r[1];SET=r[2];tab('cats')}).catch(function(){})}
function tab(t){T.forEach(function(x){$('t_'+x[0]).className=x[0]==t?'on':''});({cats:vCats,post:function(){vPost()},posts:vPosts,svc:vSvc,partners:vPartners,about:vAbout,byowner:vByowner,fb:vFb,opt:vOpt,seo:vSeo})[t]()}
function reload(f){api('categories').then(function(c){cats=c;f()})}
// ---- categories ----
function kids(id){return cats.filter(function(c){return c.parent_id==id})}
function vCats(){var rootRow='<div class="card"><b>Nayi bari category</b><div class="row"><input id="nn" placeholder="Category name"><select id="ng" style="width:auto"><option value="service">Service</option><option value="project">Project</option></select><button class="b f" onclick="addCat(null)">Add</button></div></div>';
 $('main').innerHTML=rootRow+'<div id="tree">'+kids(null).map(node).join('')+'</div>'}
function node(c){var k=kids(c.id);return'<details><summary><span>'+esc(c.name)+' ('+k.length+')</span><span class="row"><button class="b" onclick="event.preventDefault();editCat('+c.id+')">Edit</button><button class="b" onclick="event.preventDefault();addCat('+c.id+')">+ Add</button><button class="b r" onclick="event.preventDefault();delCat('+c.id+')">Delete</button></span></summary>'+(c.img?'<div style="padding:.4rem"><img src="'+esc(c.img)+'" style="height:3rem;border-radius:6px"></div>':'')+k.map(node).join('')+'</details>'}
function addCat(pid){var n=pid===null?$('nn').value:prompt('Nayi category ka naam');if(!n)return;api('categories','POST',{name:n,parent_id:pid,grp:pid===null?$('ng').value:undefined}).then(function(r){if(r.error)return toast(r.error,1);toast('Category add ho gayi');reload(vCats)})}
function delCat(id){var c=cats.find(function(x){return x.id==id});if(confirm(c.name+' aur uski sab choti categories delete hon gi. Pakka?'))api('categories/'+id,'DELETE').then(function(){toast('Deleted');reload(vCats)})}
function editCat(id){var c=cats.find(function(x){return x.id==id});$('main').innerHTML='<div class="card"><h3>'+esc(c.name)+'</h3><label>Name</label><input id="en" value="'+esc(c.name)+'"><label>Picture (gallery me is category ke naam se save hogi)</label><div class="row"><button class="b" onclick="pick(0,function(u){$(\'ei\').value=u[0];toast(\'Picture upload\')})">Upload picture</button><input id="ei" value="'+esc(c.img)+'" placeholder="picture url"></div><label>Picture par Link button: naam</label><input id="eb" value="'+esc(c.btn)+'" placeholder="Open"><label>Link button: URL (khali = category ka apna page)</label><input id="el" value="'+esc(c.link)+'"><div class="row" style="margin-top:.8rem"><button class="b f" onclick="saveCat('+id+')">Save</button><button class="b" onclick="vCats()">Back</button></div></div>'}
function saveCat(id){api('categories/'+id,'PUT',{name:$('en').value,img:$('ei').value,btn:$('eb').value,link:$('el').value}).then(function(){toast('Save ho gaya');reload(vCats)})}
// ---- editor toolbar ----
function toolbar(id){var h='';for(var i=1;i<=5;i++)h+='<button class="b" onmousedown="event.preventDefault();document.execCommand(\'formatBlock\',false,\'h'+i+'\')">H'+i+'</button>';
 return'<div class="tb">'+h+'<button class="b" onmousedown="event.preventDefault();document.execCommand(\'formatBlock\',false,\'p\')">P</button><button class="b" onmousedown="event.preventDefault();lnk()">Link</button><button class="b" onmousedown="event.preventDefault();img(\''+id+'\')">Picture</button><button class="b" onmousedown="event.preventDefault();sld(\''+id+'\',\'side\')">Slider</button><button class="b" onmousedown="event.preventDefault();sld(\''+id+'\',\'corner\')">Corner slider</button></div>'}
function lnk(){var s=getSelection(),t=s.toString()||prompt('Link ka naam');var u=prompt('Link URL (https://...)');if(!t||!u)return;document.execCommand('insertHTML',false,'<a href="'+esc(u)+'">'+esc(t)+'</a>')}
function img(id){pick(0,function(u){document.execCommand('insertHTML',false,imgTag(u[0],false));})}
function sld(id,st){pick(1,function(u){document.execCommand('insertHTML',false,'<div class="qs '+st+'">'+u.map(function(x,i){return imgTag(x,i===0)}).join('')+'</div><p></p>')})}
// ---- post ----
function treeOpts(sel){return cats.filter(function(c){return c.parent_id===null}).map(function f(c){var d=c.path.split('/').length-1;return'<label style="margin:0;color:var(--tx);padding-left:'+(d*.9)+'rem"><input type="checkbox" style="width:auto" value="'+c.path+'" '+(sel.indexOf(c.path)>=0?'checked':'')+'> '+esc(c.name)+'</label>'+kids(c.id).map(f).join('')}).join('')}
function vPost(p){p=p||{title:'',cats:[],images:[],body:'',buttons:[],slider:'side',width:100,indexed:1,status:'live'};cur=p;var bt=p.buttons||[];
 $('main').innerHTML='<div class="card"><label>Post title</label><input id="pt" value="'+esc(p.title)+'"><label>Pictures</label><div class="thumbs" id="th"></div><button class="b" onclick="pick(1,function(u){cur.images=cur.images.concat(u);th()})">Pictures upload</button>'
 +'<label>Category select (ek ya zyada)</label><div class="card" id="cs" style="max-height:14rem;overflow:auto">'+treeOpts(p.cats||[])+'</div>'
 +'<label>Content</label>'+toolbar('ed')+'<div id="ed" class="ed" contenteditable="true">'+(p.body||'')+'</div>'
 +'<label>Picture slider style (post page par)</label><select id="ps"><option value="side">Up-down / side slider</option><option value="corner">Corner bar</option></select>'
 +'<label>Post width</label><select id="pw2"><option>100</option><option>80</option><option>50</option></select>'
 +'<label>Link button boxes (max 5, jo khali ya band hon wo post par nahi aayen ge)</label>'+[0,1,2,3,4].map(function(i){var b=bt[i]||{};return'<div class="row"><input id="bl'+i+'" placeholder="Button name" value="'+esc(b.label)+'"><input id="bu'+i+'" placeholder="https://..." value="'+esc(b.url)+'"><label style="margin:0"><input type="checkbox" style="width:auto" id="bs'+i+'" '+(b.show!==false?'checked':'')+'> show</label></div>'}).join('')
 +'<label><input type="checkbox" style="width:auto" id="pi" '+(p.indexed?'checked':'')+'> Google search engine par post nazar aaye</label><label>Status</label><select id="pst"><option value="live">Live</option><option value="draft">Draft</option></select>'
 +'<div class="row" style="margin-top:1rem"><button class="b f" onclick="savePost()">Save post</button></div><p id="pl"></p></div>';
 $('ps').value=p.slider;$('pw2').value=p.width;$('pst').value=p.status;th()}
function th(){$('th').innerHTML=cur.images.map(function(u,i){return'<div><img src="'+u+'"><i onclick="cur.images.splice('+i+',1);th()">×</i></div>'}).join('')}
function savePost(){var b={title:$('pt').value,images:cur.images,cats:[].map.call(document.querySelectorAll('#cs input:checked'),function(x){return x.value}),body:$('ed').innerHTML,slider:$('ps').value,width:+$('pw2').value,indexed:$('pi').checked,status:$('pst').value,
 buttons:[0,1,2,3,4].map(function(i){return{label:$('bl'+i).value,url:$('bu'+i).value,show:$('bs'+i).checked}}).filter(function(x){return x.label&&x.url})};if(!b.title)return toast('Title likhein',1);
 api('posts'+(cur.id?'/'+cur.id:''),cur.id?'PUT':'POST',b).then(function(r){if(!r.ok)return toast('Error',1);toast('Post save ho gayi');if(r.slug){cur.id=r.id;$('pl').innerHTML='Link: <a href="/p/'+r.slug+'" target="_blank">https://qivbuild.site/p/'+r.slug+'</a>'}api('posts').then(function(p){posts=p})})}
function vPosts(){$('main').innerHTML=posts.map(function(p){return'<div class="card row"><b style="flex:1">'+esc(p.title)+' <small>('+p.status+')</small></b><a class="b" target="_blank" href="/p/'+p.slug+'">View</a><button class="b" onclick="editPost('+p.id+')">Edit</button><button class="b r" onclick="delPost('+p.id+')">Delete</button></div>'}).join('')||'<p>Abhi koi post nahi</p>'}
function editPost(id){api('posts/'+id).then(function(p){p.cats=JSON.parse(p.cats||'[]');p.images=JSON.parse(p.images||'[]');p.buttons=JSON.parse(p.buttons||'[]');tab('post');vPost(p)})}
function delPost(id){if(confirm('Post delete karein?'))api('posts/'+id,'DELETE').then(function(){api('posts').then(function(p){posts=p;vPosts()})})}
// ---- services (5 content) ----
function vSvc(){var r=cats.filter(function(c){return c.parent_id===null&&c.grp==='service'}),s=SET.svc||{};
 $('main').innerHTML='<p style="color:var(--mut)">Har content ka text edit karein. Khali chor den to website ka purana text rahe ga. Sliding picture automatic gallery se aati hai.</p>'+r.map(function(c){return'<details><summary>'+esc(c.name)+'</summary><div style="padding:.6rem">'+toolbar('sv_'+c.slug)+'<div class="ed" id="sv_'+c.slug+'" contenteditable="true" data-k="'+c.slug+'">'+((s[c.slug]||{}).html||'')+'</div></div></details>'}).join('')+'<button class="b f" onclick="saveSvc()" style="margin-top:1rem">Save services</button>'}
function saveSvc(){var o={};document.querySelectorAll('[data-k]').forEach(function(e){if(e.innerHTML.trim())o[e.dataset.k]={html:e.innerHTML}});SET.svc=o;api('settings','PUT',{svc:o}).then(function(){toast('Services save')})}
// ---- partners (Our Material Partners slider) ----
var PT=[];
function vPartners(){api('partners').then(function(r){PT=r;drawPT()})}
function drawPT(){$('main').innerHTML='<p style="color:var(--mut)">Material Partners slider: company ka logo, naam, link aur chhoti detail. Max 20. Badlav Save dabane par har page par laag hota hai.</p>'
 +PT.map(function(c,i){return'<div class="card"><div class="row"><div style="width:3.2rem;height:3.2rem;border-radius:50%;background:var(--ib);color:var(--bl);display:flex;align-items:center;justify-content:center;overflow:hidden;font-weight:700">'+(c.logo?'<img src="'+esc(c.logo)+'" style="width:100%;height:100%;object-fit:cover">':esc((c.name||'?').charAt(0)))+'</div><button class="b" onclick="ptLogo('+i+')">Logo upload</button>'+(c.logo?'<button class="b r" onclick="PT['+i+'].logo=\'\';drawPT()">Logo hatayen</button>':'')+'</div>'
 +'<label>Company name</label><input value="'+esc(c.name)+'" oninput="PT['+i+'].name=this.value"><label>Company link (https://...)</label><input value="'+esc(c.link)+'" oninput="PT['+i+'].link=this.value"><label>Chhoti detail</label><input value="'+esc(c.content)+'" oninput="PT['+i+'].content=this.value">'

// ---- purani bari tasveerain ek click par optimize ----
var OPT=[];
function legacy(u){return typeof u==='string'&&/^\/media\/img\/(?!m-)[\w.-]+$/.test(u)}
function optLog(t){var e=$('op_log');e.textContent+=t+'\n';e.scrollTop=e.scrollHeight}
function vOpt(){$('main').innerHTML='<p style="color:var(--mut)">Jo tasveerain naye 4-size system se pehle upload hui thin (bari file, ek hi size), unhe yahan se ek click par chhota aur tez kiya jata hai. Design wahi rehta hai, sirf file halki hoti hai.</p><div class="card"><div id="op_info">Scan ho raha hai...</div><button class="b f" id="op_go" disabled onclick="optRun()">Optimize shuru karein</button><div id="op_log" style="margin-top:.6rem;white-space:pre-wrap;max-height:16rem;overflow:auto;font-size:.85rem"></div></div>';
 Promise.all([api('posts'),api('categories')]).then(function(r){var P=r[0]||[],C=r[1]||[];OPT=[];
  P.forEach(function(p){var im=[];try{im=JSON.parse(p.images||'[]')}catch(e){}if(im.some(legacy))OPT.push({t:'post',id:p.id,name:p.title,im:im})});
  C.forEach(function(c){if(legacy(c.img))OPT.push({t:'cat',id:c.id,name:c.name,img:c.img})});
  var n=0;OPT.forEach(function(j){n+=j.t==='post'?j.im.filter(legacy).length:1});
  $('op_info').textContent=OPT.length?('Purani '+n+' tasveerain mili ('+OPT.length+' post/category me). Optimize karne se unke 4 size ban jayenge.'):'Koi purani bari tasveer nahi mili. Sab theek hai.';
  $('op_go').disabled=!OPT.length})}
function optRun(){var go=$('op_go');go.disabled=true;var seen={},ok=0,bad=0;
 function conv(u){if(seen[u])return Promise.resolve(seen[u]);return fetch(u).then(function(r){if(!r.ok)throw new Error('download '+r.status);return r.blob()}).then(function(b){return up(b)}).then(function(n){seen[u]=n;return n})}
 function one(k){if(k>=OPT.length){optLog('Mukammal: '+ok+' theek, '+bad+' fail. Ab Cloudflare Purge karein.');toast('Optimize mukammal');return Promise.resolve()}
  var j=OPT[k];optLog('('+(k+1)+'/'+OPT.length+') '+j.name);
  var p=j.t==='post'?Promise.all(j.im.map(function(u){return legacy(u)?conv(u):Promise.resolve(u)})).then(function(ni){return api('optimg','PUT',{t:'post',id:j.id,images:ni})}):conv(j.img).then(function(n){return api('optimg','PUT',{t:'cat',id:j.id,img:n})});
  return p.then(function(){ok++;optLog('   ok')},function(e){bad++;optLog('   fail: '+(e&&e.message||e))}).then(function(){return one(k+1)})}
 optLog('Shuru...');one(0)}

free span guest and service entrances kitchen and service circulation parking exits ventilation and lighting Capacity is worked out from the area per guest and the exit requirements", "img": ""}, {"key": "MARKET PLANNING", "title": "Market Planning — Bazaar / Market / Commercial Area", "text": "Market planning covers shop sizes and frontage walkway widths loading and unloading access parking drainage fire exits and the electrical load of each shop The layout keeps customer movement and goods movement separate", "img": ""}]}, "fb": {"cover": "/qb-fb-cover.webp", "profile": "/qb-fb-profile.webp"}};
